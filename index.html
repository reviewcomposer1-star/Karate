<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="description" content="Karate — an offline beginner karate learning companion.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Karate">
  <title>KARATE · Dojo Companion</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="splash-screen" class="splash-screen" aria-label="Loading Karate">
    <div class="splash-inner"><span class="splash-kanji">空手</span><div class="splash-word">KARATE</div><div class="splash-line"><span></span></div><p>ENTER THE DOJO</p></div>
  </div>

  <div id="app" class="app-shell">
    <header class="app-header">
      <div class="header-left">
        <button id="back-btn" class="icon-btn hidden" type="button" aria-label="Go back">‹</button>
        <a href="#home" class="brand"><span>空手</span><strong>KARATE</strong></a>
      </div>
      <div class="header-actions">
        <button id="search-toggle-btn" class="icon-btn" type="button" aria-label="Search techniques">⌕</button>
        <button id="install-btn" class="install-pill hidden" type="button"><span>Install App</span></button>
      </div>
    </header>

    <div id="search-modal" class="search-modal hidden" role="dialog" aria-modal="true" aria-label="Search techniques">
      <div class="search-panel">
        <div class="search-bar"><span aria-hidden="true">⌕</span><input id="search-input" type="search" placeholder="Search Mae Geri, front kick…" autocomplete="off"><button id="search-close-btn" class="icon-btn" type="button" aria-label="Close search">×</button></div>
        <div id="search-results" class="search-results-container"><div class="search-empty-prompt">Search kicks, punches, blocks or stances…</div></div>
      </div>
    </div>

    <main id="router-view" class="router-view"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <a href="#home" class="nav-item" data-route="home"><span>⌂</span><small>Dojo</small></a>
      <a href="#basics" class="nav-item" data-route="basics"><span>◈</span><small>Basics</small></a>
      <a href="#kata" class="nav-item" data-route="kata"><span>▤</span><small>Kata</small></a>
      <a href="#kumite" class="nav-item" data-route="kumite"><span>◉</span><small>Kumite</small></a>
      <a href="#favorites" class="nav-item" data-route="favorites"><span>♡</span><small>Saved</small></a>
    </nav>
  </div>

  <noscript><div class="noscript">JavaScript is required to use KARATE.</div></noscript>
  <script src="./js/data.js"></script>
  <script src="./data/geri.js"></script><script src="./data/zuki.js"></script><script src="./data/uke.js"></script><script src="./data/dachi.js"></script>
  <script src="./data/kata.js"></script><script src="./data/kumite.js"></script>
  <script src="./js/audio.js"></script><script src="./js/favorites.js"></script><script src="./js/search.js"></script><script src="./js/install.js"></script><script src="./js/router.js"></script><script src="./js/sw-register.js"></script><script src="./js/app.js"></script>
</body>
</html>
